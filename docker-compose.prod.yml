version: '3.9'

services:
  web:
    build: .
    command: ggunicorn config.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    env_file:
      - .env.prod
    ports:
      - "80:8000"
    depends_on:
      - db
      - redis

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env.prod

  redis:
    image: redis:6
    volumes:
      - redis_data:/data
    env_file:
      - .env.prod

  celery:
    container_name: celery
    build: .
    command: >
      bash -c "celery -A config.celery  worker --loglevel=INFO -B"
    env_file:
      - .env
    depends_on:
      - redis
      - db

  celery_beat:
    container_name: celery_beat
    build: .
    env_file:
      - .env
    command: >
      bash -c "celery -A config beat --loglevel=info"
    depends_on:
      - redis
      - db

  nginx:
    build:
      context: ./nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/ect/nginx/nginx.conf
      - static_volume:/app/staticfiles

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume: